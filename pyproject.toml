[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "active-gs-search"
version = "0.1.0"
description = "Headless VLM target search and labeling in Gaussian scenes"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yuhaonan"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.15,<2", "Pillow>=10", "plyfile>=1.1", "torch>=2.5", "torchvision>=0.20", "gsplat>=1.4,<2", "transformers>=4.57,<5", "opencv-python-headless>=4.10,<5", "numba>=0.60", "accelerate>=1.6,<2", "safetensors>=0.4", "ninja>=1.11"]

[project.optional-dependencies]
plot = ["plotly>=6,<8"]
quantization = ["bitsandbytes>=0.45"]
navigation = ["open3d>=0.19", "cvxpy>=1.6", "clarabel>=0.11", "cvxopt>=1.3", "dijkstra3d>=1.15", "polytope>=0.2.5", "unfoldNd>=0.2.3", "sympy>=1.13"]
dev = ["pytest>=8", "aiohttp>=3.9", "build>=1.2"]

[project.scripts]
gs-search = "gs_search.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["gs_search*"]

[tool.setuptools.package-data]
gs_search = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
